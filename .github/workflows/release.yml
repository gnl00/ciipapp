name: Release ciip for macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify tag and all application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs validate "$RELEASE_TAG"
      - run: node --test scripts/release.test.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # CGO/AppKit must compile on the corresponding native CPU.
          - runner: macos-15
            goarch: arm64
          - runner: macos-15-intel
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      CIIP_ARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native architecture
        run: sh scripts/release-package.sh --check-host "$CIIP_ARCH"
      - run: npm ci
      - run: npm test
      - run: npm run build:app
      - run: go test ./...
      - run: go vet ./...
      - name: Build application
        run: sh build.sh
      - run: npm run test:bundle
      - name: Verify bundle and create ZIP and DMG
        run: sh scripts/release-package.sh "$RELEASE_TAG" "$CIIP_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.goarch }}
          path: build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: build/release-assets
          merge-multiple: true
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs publish "$RELEASE_TAG" build/release-assets
      - name: Refresh website download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
