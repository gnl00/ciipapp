name: Deploy ciip website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
      - 'scripts/pages-env.mjs'
      - 'scripts/pages-env.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # A stable Releases list reflects tag publications without another Pages deployment.
      - name: Set repository URLs
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          RELEASE_URL: ${{ vars.CIIP_RELEASE_URL }}
        run: node scripts/pages-env.mjs
      - run: npm run typecheck -w @ciip/website
      - run: npm run test:website
      - run: npm run build:website
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
